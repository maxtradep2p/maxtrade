<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MaxTrade</title>
  <meta name="description" content="Taking you to MaxTrade…" />
  <meta name="theme-color" content="#0d0d0d" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --background: #0d0d0d;
      --foreground: #fafafa;
      --card: #1c1c1c;
      --border: rgba(255, 255, 255, 0.16);
      --muted: #3a3a3a;
      --muted-foreground: #a6a6a6;
      --primary: #e8da2c;
      --primary-glow: #f1e65a;
      --primary-foreground: #1a1806;
      --negative: #ec5a5a;
    }
    @supports (color: oklch(0.5 0.1 100)) {
      :root {
        --background: oklch(0.09 0 0);
        --foreground: oklch(0.98 0 0);
        --card: oklch(0.165 0 0);
        --muted: oklch(0.23 0 0);
        --muted-foreground: oklch(0.68 0 0);
        --primary: oklch(0.87 0.19 96);
        --primary-glow: oklch(0.92 0.17 98);
        --primary-foreground: oklch(0.14 0.01 96);
        --negative: oklch(0.654 0.211 18);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background-color: var(--background);
      background-image:
        radial-gradient(1000px 600px at 12% -10%, color-mix(in srgb, var(--primary) 16%, transparent), transparent 60%),
        radial-gradient(800px 520px at 92% 8%, color-mix(in srgb, var(--primary-glow) 10%, transparent), transparent 62%),
        radial-gradient(700px 500px at 50% 110%, rgba(60, 200, 130, 0.08), transparent 60%);
      color: var(--foreground);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(env(safe-area-inset-top), 1.25rem) 1.25rem max(env(safe-area-inset-bottom), 1.25rem);
    }
    .card {
      width: 100%;
      max-width: 380px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2.25rem 1.5rem 1.75rem;
      box-shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.7);
      animation: rise 0.5s ease both;
    }
    .logo {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      margin: 0 auto 1.1rem;
      display: block;
      border: 1px solid var(--border);
      box-shadow: 0 18px 44px -18px color-mix(in srgb, var(--primary) 45%, transparent);
    }
    h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }
    .sub { margin-top: 0.4rem; font-size: 0.92rem; color: var(--muted-foreground); min-height: 1.4em; }
    .bar {
      margin: 1.6rem auto 0;
      height: 6px;
      width: 100%;
      border-radius: 999px;
      background: var(--muted);
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--primary), var(--primary-glow));
      animation: slide 1.1s ease-in-out infinite;
    }
    .btn {
      display: none;
      margin-top: 1.4rem;
      width: 100%;
      padding: 0.85rem 1rem;
      border: 0;
      border-radius: 1rem;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--primary-foreground);
      background: linear-gradient(135deg, var(--primary), var(--primary-glow));
      box-shadow: 0 18px 44px -18px color-mix(in srgb, var(--primary) 45%, transparent);
      cursor: pointer;
      text-decoration: none;
    }
    .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    .error .sub { color: var(--negative); }
    .error .bar { display: none; }
    .error .btn.retry, .show-continue .btn.go { display: block; }
    .foot { margin-top: 1.4rem; font-size: 0.72rem; color: var(--muted-foreground); }
    @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="card" id="card">
    <img class="logo" src="icon-192.png" alt="MaxTrade" width="76" height="76" />
    <h1>MaxTrade</h1>
    <p class="sub" id="msg" aria-live="polite">Taking you to MaxTrade…</p>
    <div class="bar" aria-hidden="true"><span></span></div>
    <a class="btn go" id="go" href="#">Continue to MaxTrade</a>
    <button class="btn retry" id="retry" type="button">Try again</button>
    <p class="foot">Secure wallet &amp; live markets</p>
    <noscript><p class="sub">Please turn on JavaScript to open MaxTrade.</p></noscript>
  </main>

  <script>
    (function () {
      var card = document.getElementById("card");
      var msg = document.getElementById("msg");
      var go = document.getElementById("go");
      var retry = document.getElementById("retry");
      var DELAY_MS = 1200; // short pause so people see the branding

      // Only real web addresses are allowed (blocks javascript:, data:, etc.).
      function safeUrl(raw) {
        try {
          var u = new URL(String(raw).trim());
          if (u.protocol !== "http:" && u.protocol !== "https:") return null;
          return u;
        } catch (e) {
          return null;
        }
      }

      function fail(text) {
        card.className = "card error";
        msg.textContent = text;
      }

      function start() {
        card.className = "card";
        msg.textContent = "Taking you to MaxTrade…";

        // config.json is re-read every visit (cache-busted) so a new address works right away.
        fetch("config.json?t=" + Date.now(), { cache: "no-store" })
          .then(function (r) {
            if (!r.ok) throw new Error("config " + r.status);
            return r.json();
          })
          .then(function (cfg) {
            var target = safeUrl(cfg && cfg.url);
            if (!target || /YOUR-IP-OR-DOMAIN/i.test(target.href)) {
              fail("MaxTrade's address isn't set yet. Please try again soon.");
              return;
            }
            // Keep any ?query or #hash the visitor opened this page with.
            if (location.search && !target.search) target.search = location.search;
            if (location.hash && !target.hash) target.hash = location.hash;

            go.href = target.href;
            setTimeout(function () { card.className = "card show-continue"; }, 4000);
            setTimeout(function () { location.replace(target.href); }, DELAY_MS);
          })
          .catch(function () {
            fail("We couldn't load MaxTrade's address. Check your connection and try again.");
          });
      }

      retry.addEventListener("click", start);
      start();
    })();
  </script>
</body>
</html>
